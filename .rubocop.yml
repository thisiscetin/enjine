plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "coverage/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: false
Style/RaiseArgs:
  Enabled: false
Style/MultilineBlockChain:
  Enabled: false

Layout/LineLength:
  Max: 130

# A rules engine has a few long, linear methods that mirror the rules text.
Metrics/MethodLength:
  Max: 40
Metrics/AbcSize:
  Max: 55
Metrics/CyclomaticComplexity:
  Max: 18
Metrics/PerceivedComplexity:
  Max: 18
Metrics/ClassLength:
  Max: 400
Metrics/ModuleLength:
  Max: 250
Metrics/ParameterLists:
  Max: 7
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "Rakefile"

RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/NestedGroups:
  Max: 4
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
