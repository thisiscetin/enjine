plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "coverage/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: false
Style/RaiseArgs:
  Enabled: false
Style/MultilineBlockChain:
  Enabled: false

Layout/LineLength:
  Max: 140

# Real-card specs are named after their fixture family (spec/fixtures/cards/real/<family>.json).
Naming/FileName:
  Exclude:
    - "spec/integration/real_cards/*"

# A rules engine has a few long, linear methods that mirror the rules text.
Metrics/MethodLength:
  Max: 40
Metrics/ClassLength:
  Max: 400
Metrics/ModuleLength:
  Max: 250
Metrics/ParameterLists:
  Max: 7
  # Keyword arguments name themselves; the deck builder's options are all keywords.
  CountKeywordArgs: false
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
    - "Rakefile"

RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/NestedGroups:
  Max: 4
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false

# The CLI text renderer is a lookup table of event/option phrasings.
Metrics/AbcSize:
  Max: 55
  Exclude:
    - "lib/enjine/cli/text.rb"
    - "lib/enjine/snapshot.rb"
Metrics/CyclomaticComplexity:
  Max: 18
  Exclude:
    - "lib/enjine/cli/text.rb"
    - "lib/enjine/cli.rb"
# Real-card specs are named after their fixture family (spec/fixtures/cards/real/<family>.json).
Naming/FileName:
  Exclude:
    - "spec/integration/real_cards/*_spec.rb"
Naming/PredicateMethod:
  Enabled: false
Naming/MethodParameterName:
  AllowedNames: [ev, id, to, n, in]
Style/ItBlockParameter:
  Enabled: false
Style/FormatStringToken:
  Enabled: false

Metrics/PerceivedComplexity:
  Max: 18
