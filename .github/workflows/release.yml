name: Release

# Push a version tag (e.g. v0.1.0) matching lib/enjine/version.rb to publish the gem.
# Publishing uses RubyGems trusted publishing (OIDC): no API key is stored in GitHub.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # rake release pushes the tag and git refs
      id-token: write   # OIDC token for RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Tag matches the gem version; skip if already published
        id: check
        run: |
          version=$(ruby -Ilib -e 'require "enjine/version"; print Enjine::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://rubygems.org/api/v2/rubygems/enjine/versions/$version.json")
          echo "published=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Gate
        run: bundle exec rake
      - if: steps.check.outputs.published != 'true'
        uses: rubygems/release-gem@v1
